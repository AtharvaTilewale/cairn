[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairnlab"
version = "0.1.0"
description = "Cairn: the lab notebook that writes itself."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Atharva Tilewale" }]
dependencies = [
  "typer",
  "rich",
  "pydantic>=2",
  "python-ulid",
  "python-dotenv",
  "openai",
  "watchdog",
  "pathspec",
  "jinja2",
  "pillow",
]

[project.optional-dependencies]
# synthlab drives a fake numpy/matplotlib project; Cairn itself does not need these.
eval = ["numpy", "matplotlib"]
dev = ["pytest", "ruff", "numpy", "matplotlib"]

[project.scripts]
cairn = "cairnlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cairnlab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Kept byte-for-byte as written by hand; not reformatted.
extend-exclude = ["scripts/smoke_meta.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "shell: drives a real interactive bash; needs bash on PATH (deselect with -m 'not shell')",
]
